# docker-compose.test.yml
services:
  test-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TEST_DB}
    ports:
      - "${POSTGRES_TEST_PORT:-5434}:5432"

  test-redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_TEST_PORT:-6381}:6379"